name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
      - run: npm run check
      # test:browser currently assumes a server is already running on 127.0.0.1:4174.
      # Keep it out of CI until its smoke script owns server startup and shutdown.
